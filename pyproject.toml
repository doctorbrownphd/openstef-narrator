[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstef-narrator"
version = "0.1.0"
description = "Plain-language narrative reports for OpenSTEF load forecasts"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Jeremy Haynes" }]
keywords = ["energy", "forecast", "narrative", "openstef", "explainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]
llm = [
    "anthropic>=0.40",
]
weather = [
    "httpx>=0.25",
]
synth = [
    "opensynth-ne",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
    "ruff>=0.1",
]

[project.urls]
Repository = "https://github.com/doctorbrownphd/openstef-narrator"

[project.scripts]
openstef-narrator = "openstef_narrator.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openstef_narrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
